name: Daily Escape Hatch

on:
  schedule:
    # 15:36 UTC is exactly 5:36 AM HST
    - cron: '36 15 * * *'
    # Backup triggers in case GitHub drops the first one
    - cron: '36 16 * * *'
    - cron: '36 17 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub website if needed

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 10
      
    - name: Check if already run today
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Get the UTC date of the last commit by the bot
        LAST_COMMIT_DATE=$(git log -1 --author="github-actions\[bot\]" --format=%cd --date=short || echo "none")
        TODAY=$(date -u +%Y-%m-%d)
        if [ "$LAST_COMMIT_DATE" = "$TODAY" ]; then
          echo "We already successfully published today. Cancelling this redundant backup run."
          gh run cancel ${{ github.run_id }}
          sleep 10
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Escape Hatch Scripts
      env:
        # Pulls the secret we will set in GitHub settings
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python fetcher.py
        python filter.py
        python builder.py

    - name: Commit and Push Update
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add index.html filtered_stories.json raw_payload.txt
        # Only commit if there are actually changes to avoid git crashing
        git commit -m "Automated Daily Escape Hatch update" || echo "No changes to commit"
        git push origin main
